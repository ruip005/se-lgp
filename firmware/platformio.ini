; Firmware do Arduino Uno: LCD 16x2 I2C + 2 botões + protocolo série com o PC
; Compilar: pio run      Gravar: pio run -t upload      Monitor: pio device monitor
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    thomasfredericks/Bounce2@^2.71
