# O Mosquitto 2.x por defeito só aceita ligações de localhost DENTRO do contentor.
# Sem "listener 1883" o PC não consegue ligar-se ao broker.
listener 1883
# Aceitável só em laboratório/rede local. Nunca expor este broker à internet.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
